name: Build Electrobun (Baseline Linux CPU)

on:
  workflow_dispatch: # Allows you to trigger the build manually via GitHub UI
  schedule:
    - cron: '0 0 * * 0' # Auto-runs every Sunday at midnight

jobs:
  build-linux-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Electrobun repository
        uses: actions/checkout@v4
        with:
          repository: 'blackboardsh/electrobun'
          submodules: recursive
          ref: main # Change this to a specific tag if you want a stable release

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js & Hutch
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g hutch

      - name: Patch build.ts for Baseline CPU
        working-directory: ./package
        run: |
          sed -i 's/bun-linux-x64/bun-linux-x64-baseline/g' build.ts

      - name: Build Electrobun
        working-directory: ./package
        run: hutch build:dev

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-linux-baseline
          path: package/dist-linux-x64/
          retention-days: 14